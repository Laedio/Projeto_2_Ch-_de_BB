<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sucesso - Chá da Ayla</title>
</head>
<body style="background-color: #f9fafb; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
      <div style="text-align: center; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
      <h2 style="color: #db2777;">Confirmação Recebida! 🎉</h2>
      <p>Obrigado por confirmar sua presença no Chá da Ayla.</p>
      
      <hr style="border: 0; border-top: 1px solid #fce7f3; margin: 20px 0;">

      <p style="font-size: 0.9rem; color: #666;">Quer avisar a mamãe agora?</p>
      
      <a id="btnZap" href="#" target="_blank" 
        style="display: inline-block; background-color: #25D366; color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1rem; transition: 0.3s;">
        <i class="fab fa-whatsapp"></i> Avisar pelo WhatsApp 📱
      </a>

      <br><br>
      <a href="/" style="color: #db2777; text-decoration: none; font-size: 0.8rem;">⬅ Voltar para o início</a>
  </div>

  <script>
      // Configurações do Link
      const telefone = "5585991994249"; // SUBSTITUA: Coloque o número da mãe (com DDD e sem espaços)
      const mensagem = "Oi! Acabei de confirmar minha presença no Chá da Ayla! Mal posso esperar! 😊";
      
      // O encodeURIComponent transforma espaços e emojis em códigos de URL
      const linkFinal = `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;
      
      // Atribui o link ao botão
      document.getElementById("btnZap").href = linkFinal;
  </script>
</body>
</html>
