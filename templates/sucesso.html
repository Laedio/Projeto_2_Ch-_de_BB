<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sucesso - Chá da Ayla</title>
</head>
<body style="background-color: #f9fafb; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px;">
        <div style="font-size: 50px; margin-bottom: 20px;">✅</div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <h2 style="color: #db2777; margin-bottom: 10px;">{{ message }}</h2>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <p style="color: #666; line-height: 1.6;">Estamos muito felizes que você fará parte desse momento especial da nossa pequena Ayla!</p>
        
        <a href="/" style="display: inline-block; margin-top: 20px; color: #db2777; text-decoration: none; font-weight: bold; border: 2px solid #db2777; padding: 10px 20px; border-radius: 10px; transition: 0.3s;">
            ← Voltar ao Início
        </a>
    </div>
</body>
</html>
